{{- $height := .Get "height" | default "400" -}}
{{- $id := printf "echarts2-%d" .Ordinal -}}
<div class="echarts2-panel">
  <div id="{{ $id }}" class="echarts2-panel__chart" style="height: {{ $height }}px;"></div>
</div>
{{- if not (.Page.Scratch.Get "echarts2-loaded") -}}
{{- .Page.Scratch.Set "echarts2-loaded" true -}}
<style>
.echarts2-panel {
  position: relative;
  width: 76%;
  margin: 1.25rem auto 1.75rem;
  padding: 10px;
  overflow: hidden;
  border: 1px solid rgba(15, 23, 42, 0.06);
  border-radius: 6px;
  box-sizing: border-box;
  background: #fafbfc;
  box-shadow: none;
}

.echarts2-panel__chart {
  position: relative;
  z-index: 1;
  width: 100%;
  margin: 0 auto;
}

@media (max-width: 680px) {
  .echarts2-panel {
    width: 100%;
    margin: 1rem auto 1.5rem;
    padding: 8px;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
{{- end -}}
<script>
(function () {
  var container = document.getElementById('{{ $id }}');
  if (!container) {
    return;
  }

  var option = {{ .Inner | safeJS }};
  var chart;

  if (option && (option.backgroundColor === '#fff' || option.backgroundColor === '#ffffff' || option.backgroundColor === 'white')) {
    option.backgroundColor = 'transparent';
  }

  function render() {
    if (chart) {
      return;
    }
    chart = echarts.init(container, null, { renderer: 'canvas' });
    chart.setOption(option);

    if (window.ResizeObserver) {
      var resizeObserver = new ResizeObserver(function () {
        chart.resize();
      });
      resizeObserver.observe(container);
      window.addEventListener('pagehide', function () {
        resizeObserver.disconnect();
        chart.dispose();
      }, { once: true });
    } else {
      window.addEventListener('resize', function () {
        chart.resize();
      });
    }
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        observer.disconnect();
        render();
      }
    }, { rootMargin: '200px 0px' });
    observer.observe(container);
  } else {
    render();
  }
})();
</script>
