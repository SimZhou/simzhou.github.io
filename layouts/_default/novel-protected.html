{{ define "title" }}{{ .Title }}{{ end }}

{{ define "content" }}
{{ $manifest := .Params.protectedManifest }}
<article class="page single novel-protected-page">
  <h1 class="single-title animate__animated animate__pulse animate__faster">{{ .Title }}</h1>
  {{ with .Params.subtitle }}
  <p class="single-subtitle">{{ . }}</p>
  {{ end }}

  <div class="content" id="novel-shell"
       data-manifest="{{ $manifest }}"
       data-password-hint="{{ .Params.passwordHint }}"
       data-empty-note="{{ .Params.emptyNote }}">
    {{ .Content }}

    <section class="novel-gate" id="novel-gate">
      <h2>访问密码</h2>
      <p>这个页面没有站内入口。输入密码后，浏览器会在本地解密章节内容。</p>
      <label for="novel-password">密码</label>
      <input id="novel-password" type="password" autocomplete="current-password" />
      <button type="button" id="novel-unlock">解锁</button>
      <p class="novel-hint" id="novel-hint"></p>
      <p class="novel-error" id="novel-error" hidden></p>
    </section>

    <section class="novel-library" id="novel-library" hidden>
      <div class="novel-sidebar">
        <h2>章节目录</h2>
        <ol id="novel-chapter-list"></ol>
      </div>
      <div class="novel-reader">
        <div class="novel-reader-meta">
          <h2 id="novel-chapter-title"></h2>
          <p id="novel-chapter-subtitle"></p>
        </div>
        <div class="novel-reader-body" id="novel-reader-body"></div>
      </div>
    </section>
  </div>
</article>

<script>
(() => {
  const shell = document.getElementById("novel-shell");
  if (!shell) return;

  const manifestPath = shell.dataset.manifest;
  const hint = shell.dataset.passwordHint || "";
  const emptyNote = shell.dataset.emptyNote || "该章节尚未加入中文译文。";
  const errorEl = document.getElementById("novel-error");
  const hintEl = document.getElementById("novel-hint");
  const listEl = document.getElementById("novel-chapter-list");
  const bodyEl = document.getElementById("novel-reader-body");
  const titleEl = document.getElementById("novel-chapter-title");
  const subtitleEl = document.getElementById("novel-chapter-subtitle");
  const gateEl = document.getElementById("novel-gate");
  const libraryEl = document.getElementById("novel-library");
  const inputEl = document.getElementById("novel-password");
  const buttonEl = document.getElementById("novel-unlock");

  let manifest = null;
  let password = "";
  let activeChapterIndex = 0;

  const decoder = new TextDecoder();

  function b64ToBytes(value) {
    return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
  }

  async function deriveKey(passwordValue, payload) {
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(passwordValue),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(payload.salt),
        iterations: payload.iterations,
        hash: payload.hash,
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptPayload(payload) {
    const key = await deriveKey(password, payload);
    const ciphertext = b64ToBytes(payload.ciphertext);
    const tag = b64ToBytes(payload.tag);
    const joined = new Uint8Array(ciphertext.length + tag.length);
    joined.set(ciphertext, 0);
    joined.set(tag, ciphertext.length);
    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
      key,
      joined
    );
    return JSON.parse(decoder.decode(plaintext));
  }

  function renderChapterList() {
    listEl.innerHTML = "";
    manifest.chapters.forEach((chapter, index) => {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `第 ${chapter.number} 章`;
      if (chapter.title_zh) {
        button.textContent += ` · ${chapter.title_zh}`;
      }
      button.className = "novel-chapter-button";
      if (!chapter.asset) {
        button.disabled = true;
      }
      if (index === activeChapterIndex) {
        button.dataset.active = "true";
      }
      button.addEventListener("click", () => {
        activeChapterIndex = index;
        renderChapterList();
        void renderChapter(index);
      });
      li.appendChild(button);
      listEl.appendChild(li);
    });
  }

  async function renderChapter(index) {
    const chapter = manifest.chapters[index];
    titleEl.textContent = `第 ${chapter.number} 章${chapter.title_zh ? `：${chapter.title_zh}` : ""}`;
    subtitleEl.textContent = chapter.title_en || "";

    if (!chapter.asset) {
      bodyEl.innerHTML = `<p>${emptyNote}</p>`;
      return;
    }

    const response = await fetch(chapter.asset, { cache: "no-store" });
    if (!response.ok) {
      throw new Error("无法读取加密章节文件。");
    }
    const encrypted = await response.json();
    const decrypted = await decryptPayload(encrypted);
    bodyEl.innerHTML = decrypted.content_html;
  }

  async function unlock() {
    errorEl.hidden = true;
    password = inputEl.value;
    if (!password) {
      errorEl.textContent = "请输入密码。";
      errorEl.hidden = false;
      return;
    }

    if (!manifest) {
      const response = await fetch(manifestPath, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("无法读取章节清单。");
      }
      manifest = await response.json();
    }

    if (manifest.probe_asset) {
      const probeResponse = await fetch(manifest.probe_asset, { cache: "no-store" });
      if (!probeResponse.ok) {
        throw new Error("无法读取密码校验文件。");
      }
      const encryptedProbe = await probeResponse.json();
      await decryptPayload(encryptedProbe);
    }

    renderChapterList();
    await renderChapter(activeChapterIndex);
    gateEl.hidden = true;
    libraryEl.hidden = false;
  }

  hintEl.textContent = hint;
  buttonEl.addEventListener("click", () => {
    unlock().catch((error) => {
      errorEl.textContent = "密码错误，或加密内容已损坏。";
      errorEl.hidden = false;
      console.error(error);
    });
  });
})();
</script>
{{ end }}
